<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Arbeitsdienst eintragen</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      max-width: 700px;
    }

    input, textarea, button {
      display: block;
      margin: 10px 0;
      padding: 5px;
      width: 100%;
      max-width: 400px;
    }

    /* Arbeitsdienste */
    #tasksList, #myHours {
      margin-top: 20px;
    }

    /* 🔹 Tagesfilter */
    #day-filter {
      margin: 15px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    #day-filter button {
      width: auto;
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #f7f7f7;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }

    #day-filter button:hover {
      background: #eaeaea;
    }

    #day-filter button.active {
      background-color: #2c7be5;
      color: white;
      border-color: #2c7be5;
      font-weight: bold;
    }

    /* 🔹 Arbeitstitel-Filter */
    .title-filter {
      margin: 15px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .title-filter button {
      width: auto;
      padding: 6px 10px;
      border: 1px solid #bbb;
      background: #f4f4f4;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }

    .title-filter button:hover {
      background: #e6e6e6;
    }

    /* 🔹 aktiver Arbeitstitel */
    .title-filter button.active {
      background-color: #198754;   /* grün, unterscheidet sich vom Tag */
      color: white;
      border-color: #198754;
      font-weight: bold;
    }

    /* Kompakter Arbeitsdienst-Rahmen */
    .task {
      max-width: 600px;
      margin: 0 auto 6px auto;
      border: 1px solid #ddd;
      padding: 8px 6px;
      margin-bottom: 6px;
      border-radius: 6px;
      background: #fafafa;
    }

    /* Aktionen (Buttons + Input) nebeneinander */
    .task-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }

    /* Helfer-Input kleiner */
    .task input[type="number"] {
      width: 80px;
      padding: 4px;
    }

    /* Buttons kompakter */
    .task button {
      padding: 5px 10px;
      font-size: 14px;
      width: auto;
    }

    /* Gefahren-Button (Austragen) */
    .task button.danger {
      background: #dc3545;
      color: white;
      border: none;
    }

    .task button.danger:hover {
      background: #bb2d3b;
    }
    
    </style>
</head>
<body>


<h1>Arbeitsdienste Vereinsverwaltung - 0.46</h1>

<div id="auth">
  <h2>Login</h2>
  <input type="email" id="email" placeholder="E-Mail">
  <input type="password" id="password" placeholder="Passwort">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Registrieren</button>
  <div id="authMessage"></div>
</div>

<div id="userArea" style="display:none;">
  <h2>Willkommen, <span id="userEmail"></span></h2>
  <button id="logoutBtn">Logout</button>

  <h3>Arbeitsdienst eintragen</h3>
  <input type="date" id="workDate">
  <input type="number" step="0.25" id="workHours" placeholder="Stunden">
  <textarea id="workDesc" placeholder="Beschreibung"></textarea>
  <button id="saveWorkBtn">Speichern</button>

  <div id="myHours">
    <h3>Meine Einträge</h3>
    <ul id="hoursList"></ul>
  </div>


  <h3>Arbeitsdienste Übersicht:</h3>
  <div id="day-filter"></div>
  <ul id="tasks"></ul>
  
</div>

<script type="module">

  let allTasks = [];
  let profileMap = {};
  let currentUserId = null;
  let currentDay = null;
  let currentTitle = null;
  
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  const supabaseUrl = 'https://hteeyyfsaotcavvtvizt.supabase.co'
  const supabaseKey = "sb_publishable_pm6p0UM8_GARF3TIY51Heg_Sk3tacHJ";
  const supabase = createClient(supabaseUrl, supabaseKey)

  console.log("Supabase Client geladen:", supabase);
  
  // Supabase initialisieren
  //const supabaseUrl = "https://hteeyyfsaotcavvtvizt.supabase.co"; // <--- DEIN URL
  //const supabaseAnonKey = "sb_publishable_pm6p0UM8_GARF3TIY51Heg_Sk3tacHJ";         // <--- DEIN ANON KEY
  //const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

  const authDiv = document.getElementById("auth");
  const userArea = document.getElementById("userArea");
  const userEmailSpan = document.getElementById("userEmail");
  const authMessage = document.getElementById("authMessage");
  
  // ---------------------------------------------------------------------
  // Login
  //----------------------------------------------------------------------
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      // Login versuchen
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      console.log("Supabase login data:", data);
      console.log("Supabase login error:", error);

      if (error) {
        authMessage.textContent = "Fehler: " + error.message;
        return;
      }

      // User korrekt aus der Session holen
      const user = data.user ?? data.session?.user;

      if (!user) {
        authMessage.textContent = "Login fehlgeschlagen: kein User gefunden.";
        return;
      }

      // User-Bereich initialisieren
      initUserArea(user);

    } catch (err) {
      console.error("Unerwarteter Fehler:", err);
      authMessage.textContent = "Unerwarteter Fehler. Siehe Konsole.";
    }
  });
  
  //-------------------------------------------------------------------------
  // Logout
  //-------------------------------------------------------------------------
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await supabase.auth.signOut();
    authDiv.style.display = "block";
    userArea.style.display = "none";
    authMessage.textContent = "";
  });

  // Benutzerbereich initialisieren
  function initUserArea(user) {
    currentUserId = user.id;
    authDiv.style.display = "none";
    userArea.style.display = "block";
    userEmailSpan.textContent = user.email;
    loadMyHours();
    loadTasks();
  }
  
  //---------------------------------------------------------------------------
  //Arbeitsdienst eintragen (Stunden speichern)
  //---------------------------------------------------------------------------
  document.getElementById("saveWorkBtn").addEventListener("click", async () => {
  const date = document.getElementById("workDate").value;
  const hours = parseFloat(document.getElementById("workHours").value);
  const desc = document.getElementById("workDesc").value;

  try {
    // Aktuellen User holen
    const { data: userData, error: userError } = await supabase.auth.getUser();

    if (userError) {
      alert("Fehler beim Abrufen des Users: " + userError.message);
      return;
    }

    if (!userData?.user) {
      alert("Kein eingeloggter User gefunden. Bitte einloggen.");
      return;
    }

    // Arbeitsstunden speichern
    const { error } = await supabase.from("work_hours").insert([{
      user_id: userData.user.id,
      date,
      hours,
      description: desc
    }]);

    if (error) {
      alert("Fehler: " + error.message);
    } else {
      loadMyHours(); // Optional: Stunden neu laden
    }

  } catch (err) {
    console.error("Unerwarteter Fehler beim Speichern:", err);
    alert("Unerwarteter Fehler. Siehe Konsole.");
  }
  });

  //----------------------------------------------------------------------------
  // Eigene Stunden laden
  //----------------------------------------------------------------------------
  async function loadMyHours() {
    const { data, error } = await supabase.from("work_hours")
      .select("*")
      .order("date", { ascending: false });
    const list = document.getElementById("hoursList");
    list.innerHTML = "";
    if(data) {
      data.forEach(h => {
        const li = document.createElement("li");
        li.textContent = `${h.date}: ${h.hours} Stunden - ${h.description}`;
        list.appendChild(li);
      });
    }
  }

  //-----------------------------------------------------------------------------------
  // Prüfen, ob User schon eingeloggt
  //-----------------------------------------------------------------------------------
  supabase.auth.onAuthStateChange((event, session) => {
    if(session && session.user) { initUserArea(session.user); }
  });

  //-----------------------------------------------------------------------------------
  // Funktion, um die verfügbaren Arbeitsdienste zu laden
  //-----------------------------------------------------------------------------------
  async function loadTasks() {
    console.log("loadTasks gestartet");

    const { data: tasks, error } = await supabase
      .from("work_tasks")
      .select(`
        id,
        title,
        start_time,
        end_time,
        max_helpers,
        visible,
        open,
        work_task_signups ( user_id, helpers )
      `)
      .eq("visible",true)
      .order("start_time", { ascending: true });

    if (error) {
      console.error(error);
      return;
    }

    allTasks = tasks;

    const userIds = [
      ...new Set(
        tasks.flatMap(t =>
          t.work_task_signups.map(s => s.user_id)
        )
      )
    ];

    if (userIds.length === 1) {
      const { data: profiles, error: profilesError } = await supabase
        .from("profiles")
        .select("id, display_name")
        .eq("id", userIds[0]);

      if (profilesError) {
        console.error(profilesError);
        return;
      }

      profileMap[profiles[0].id] = profiles[0].display_name;
    }

    if (userIds.length > 1) {
      const { data: profiles, error: profilesError } = await supabase
        .from("profiles")
        .select("id, display_name")
        .in("id", userIds);

      if (profilesError) {
        console.error(profilesError);
        return;
      }

      profileMap = Object.fromEntries(
        profiles.map(p => [p.id, p.display_name])
      );
    }
  
    renderDayButtons(tasks);
  }
  
  //--------------------------------------------------------------------
  // Gruppierung der Arbeitsdienste nach den Aufgaben
  //--------------------------------------------------------------------
//  function groupTasksByTitle(tasks) {
//    return tasks.reduce((groups, task) => {
//      const title = task.title;

//      if (!groups[title]) {
//        groups[title] = [];
//      }

//      groups[title].push(task);
//      return groups;
//    }, {});
//  }

function groupTasksByTitle(tasks) {
  return tasks.reduce((acc, task) => {
    acc[task.title] = acc[task.title] || [];
    acc[task.title].push(task);
    return acc;
  }, {});
}

  
//-----------------------------------------------------------------------

function renderDayButtons(tasks) {
  const dayDiv = document.getElementById("day-filter");
  dayDiv.innerHTML = "";

  const days = [
    ...new Set(
      tasks.map(t =>
        new Date(t.start_time).toISOString().split("T")[0]
      )
    )
  ];

  days.forEach(day => {
    const btn = document.createElement("button");
    btn.textContent = new Date(day).toLocaleDateString("de-DE", {
      weekday: "long",
      day: "2-digit",
      month: "2-digit"
    });

    btn.onclick = () => {
      // alle Buttons zuruecksetzen
      document
        .querySelectorAll("#day-filter button")
        .forEach(b => b.classList.remove("active"));

      // aktuellen Button aktiv setzen
      btn.classList.add("active");
      
      renderTasksForDay(day);
    };
    dayDiv.appendChild(btn);
  });
}

//-----------------------------------------------------------------------
// Arbeitsdienste pro Tag anzeigen
//-----------------------------------------------------------------------

function renderTasksForDay(day) {
  currentDay = day;
  const tasksDiv = document.getElementById("tasks");
  tasksDiv.innerHTML = "";

  const tasksForDay = allTasks.filter(t =>
    t.start_time.startsWith(day)
  );

  if (tasksForDay.length === 0) {
    tasksDiv.innerHTML = "<p>Keine Arbeitsdienste an diesem Tag.</p>";
    return;
  }

  const tasksByTitle = groupTasksByTitle(tasksForDay);

  const titleFilter = document.createElement("div");
  titleFilter.className = "title-filter";

  Object.keys(tasksByTitle).forEach(title => {
    const btn = document.createElement("button");
    btn.textContent = title;

    btn.onclick = () => {
      document
        .querySelectorAll(".title-filter button")
        .forEach(b => b.classList.remove("active"));

      btn.classList.add("active");
      renderTasksForTitle(day, title);
    };

    titleFilter.appendChild(btn);
  });

  tasksDiv.appendChild(titleFilter);
}

//-----------------------------------------------------------------------
//  Tasks mit gleichem Titel anzeigen
//-----------------------------------------------------------------------

function renderTasksForTitle(day, title) {
  currentTitle = title;
  const tasksDiv = document.getElementById("tasks");

  // alles außer Title-Filter löschen
  tasksDiv.querySelectorAll(".task-group-content").forEach(e => e.remove());

  const tasksForTitle = allTasks.filter(
    t =>
      t.start_time.startsWith(day) &&
      t.title === title
  );

  const content = document.createElement("div");
  content.className = "task-group-content";

  tasksForTitle.forEach(task => {
    const used = task.work_task_signups.reduce(
      (sum, s) => sum + 1 + (s.helpers || 0),
      0
    );

    const free = task.max_helpers - used;

    const alreadySignedUp = task.work_task_signups.some(
      s => s.user_id === currentUserId
    );

    const helpersList = task.work_task_signups
      .map(s => {
        const name = profileMap[s.user_id] || "Mitglied";
        const extra = s.helpers > 0 ? ` (+${s.helpers})` : "";
        return `<li>${name}${extra}</li>`;
      })
      .join("");

    // Immer, sobald sichtbar
    let actionHtml = "";
    
    if (!alreadySignedUp) {
      if (free > 0) {
        // Wenn man noch nicht angemeldet ist darf man sich immer anmelden wollten noch Plaetze frei sein
        actionHtml = `
          <label>
             Zusätzliche Helfer:
             <input type="number" min="0" max="${free - 1}" value="0">
          </label>
          <button onclick="signup('${task.id}', ${free})">
            Eintragen
          </button>
        `;
      } else {
      // Wenn keine Helfer mehr frei sind ist der Arbeitsdienst ausgebucht 
        actionHtml = "<strong>Ausgebucht</strong>
      }
    }

    //Nur wenn der Arbeitsdienst auch offen ist
    if (alreadySignedUp && task.open){
      actionHtml = `
        <div class="task-actions">
          <label>
            Helfer:
            <input type="number" ...>
          </label>
          <button onclick="updateHelpers(...)">Aktualisieren</button>
          <button class="danger" onclick="withdraw(...)">Austragen</button>
        </div>
      `;
    }

    // Eingetragen aber geschlossen
    if (alreadySignedUp && !task.open) {
      actionHtml = "<strong>Bereits eingetragen (geschlossen)</strong>";
    }

    //innerHTML zusammenbauen
    content.innerHTML += `
      <div class="task">
        <p>
          <strong>
            ${new Date(task.start_time).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}
            –
            ${new Date(task.end_time).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}
          </strong>
        </p>

        <p>Belegte Plätze: ${used} / ${task.max_helpers}</p>

        ${
          helpersList
            ? `<ul>${helpersList}</ul>`
            : `<p><em>Noch keine Anmeldungen</em></p>`
        }

        ${actionHtml}
      </div>
    `;
  
  tasksDiv.appendChild(content);
}
  
//-----------------------------------------------------------------------
// In einem Arbeitsdienst eintragen 
//-----------------------------------------------------------------------
window.signup = async function (taskId, free) {
  const helpersInput = document.getElementById(`helpers-${taskId}`);
  const helpers = helpersInput ? parseInt(helpersInput.value || 0) : 0;

  if (helpers + 1 > free) {
    alert("Nicht genügend freie Plätze vorhanden.");
    return;
  }

  const {
    data: { user },
    error: userError
  } = await supabase.auth.getUser();

  if (userError || !user) {
    alert("Bitte zuerst anmelden.");
    return;
  }

  const { error } = await supabase
    .from("work_task_signups")
    .insert({ task_id: taskId, user_id: user.id, helpers });

  if (error) {
    alert(error.message);
    console.error(error);
    return;
  }

  // --- Neu: frische Daten laden, dann aktuelle Ansicht rendern ---
  const { data: tasks, error: tasksError } = await supabase
    .from("work_tasks")
    .select(`
      id,
      title,
      start_time,
      end_time,
      max_helpers,
      visible,
      open,
      work_task_signups ( user_id, helpers )
    `)
    .eq("visible", true)
    .order("start_time", { ascending: true });

  if (tasksError) {
    console.error(tasksError);
    return;
  }

  allTasks = tasks;

  if (currentDay && currentTitle) {
    renderTasksForTitle(currentDay, currentTitle);
  }
};

//-----------------------------------------------------------------
// Aus einem Arbeitsdienst austragen 
//-----------------------------------------------------------------  

window.withdraw = async function (taskId) {
  if (!confirm("Möchtest du dich wirklich austragen?")) {
    return;
  }

  const {
    data: { user },
    error: userError
  } = await supabase.auth.getUser();

  if (userError || !user) {
    alert("Bitte zuerst anmelden.");
    return;
  }

  const { error } = await supabase
    .from("work_task_signups")
    .delete()
    .eq("task_id", taskId)
    .eq("user_id", user.id);

  if (error) {
    alert(error.message);
    console.error(error);
    return;
  }

  // --- Neu: frische Daten aus Supabase laden ---
  const { data: tasks, error: tasksError } = await supabase
    .from("work_tasks")
    .select(`
      id,
      title,
      start_time,
      end_time,
      max_helpers,
      visible,
      open,
      work_task_signups ( user_id, helpers )
    `)
    .eq("visible", true)
    .order("start_time", { ascending: true });

  if (tasksError) {
    console.error(tasksError);
    return;
  }

  allTasks = tasks;

  // aktuelle Ansicht erneut rendern
  if (currentDay && currentTitle) {
    renderTasksForTitle(currentDay, currentTitle);
  }
};

//-----------------------------------------------------------------
// Helferanzahl für bestehenden Eintrag aktualisieren (mit Prüfung)
//-----------------------------------------------------------------
window.updateHelpers = async function (taskId, maxHelpers) {
  const input = document.getElementById(`edit-helpers-${taskId}`);
  if (!input) return;

  const newHelpers = parseInt(input.value || 0);

  const task = allTasks.find(t => t.id === taskId);
  if (!task) return;

  const signup = task.work_task_signups.find(
    s => s.user_id === currentUserId
  );

  const oldHelpers = signup?.helpers || 0;

  const usedWithoutMe = task.work_task_signups.reduce(
    (sum, s) => sum + 1 + (s.helpers || 0),
    0
  ) - (1 + oldHelpers);

  const newTotalUsed = usedWithoutMe + 1 + newHelpers;

  if (newTotalUsed > maxHelpers) {
    alert("Nicht genügend freie Plätze für diese Anzahl an Helfern.");
    input.value = oldHelpers;
    return;
  }

  const { data: { user }, error: userError } = await supabase.auth.getUser();
  if (userError || !user) {
    alert("Bitte zuerst anmelden.");
    return;
  }

  const { error } = await supabase
    .from("work_task_signups")
    .update({ helpers: newHelpers })
    .eq("task_id", taskId)
    .eq("user_id", user.id);

  if (error) {
    alert(error.message);
    console.error(error);
    return;
  }

  // --- Neu: frische Daten laden, dann aktuelle Ansicht rendern ---
  const { data: tasks, error: tasksError } = await supabase
    .from("work_tasks")
    .select(`
      id,
      title,
      start_time,
      end_time,
      max_helpers,
      visible,
      open,
      work_task_signups ( user_id, helpers )
    `)
    .eq("visible", true)
    .order("start_time", { ascending: true });

  if (tasksError) {
    console.error(tasksError);
    return;
  }

  allTasks = tasks;

  if (currentDay && currentTitle) {
    renderTasksForTitle(currentDay, currentTitle);
  }
};


</script>
</body>
</html>
