<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Arbeitsdienst eintragen</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      max-width: 700px;
    }

    input, textarea, button {
      display: block;
      margin: 10px 0;
      padding: 5px;
      width: 100%;
      max-width: 400px;
    }

    /* Arbeitsdienste */
    #tasksList, #myHours {
      margin-top: 20px;
    }

    .task {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
    }

    /* 🔹 Tagesfilter */
    #day-filter {
      margin: 15px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    #day-filter button {
      width: auto;
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #f7f7f7;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }

    #day-filter button:hover {
      background: #eaeaea;
    }

    #day-filter button.active {
      background-color: #2c7be5;
      color: white;
      border-color: #2c7be5;
      font-weight: bold;
    }
  </style>
</head>
<body>


<h1>Arbeitsdienste Vereinsverwaltung - 0.22</h1>

<div id="auth">
  <h2>Login</h2>
  <input type="email" id="email" placeholder="E-Mail">
  <input type="password" id="password" placeholder="Passwort">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Registrieren</button>
  <div id="authMessage"></div>
</div>

<div id="userArea" style="display:none;">
  <h2>Willkommen, <span id="userEmail"></span></h2>
  <button id="logoutBtn">Logout</button>

  <h3>Arbeitsdienst eintragen</h3>
  <input type="date" id="workDate">
  <input type="number" step="0.25" id="workHours" placeholder="Stunden">
  <textarea id="workDesc" placeholder="Beschreibung"></textarea>
  <button id="saveWorkBtn">Speichern</button>

  <div id="myHours">
    <h3>Meine Einträge</h3>
    <ul id="hoursList"></ul>
  </div>


  <h3>Arbeitsdienste Übersicht:</h3>
  <div id="day-filter"></div>
  <ul id="tasks"></ul>
  
</div>

<script type="module">
  
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  const supabaseUrl = 'https://hteeyyfsaotcavvtvizt.supabase.co'
  const supabaseKey = "sb_publishable_pm6p0UM8_GARF3TIY51Heg_Sk3tacHJ";
  const supabase = createClient(supabaseUrl, supabaseKey)

  console.log("Supabase Client geladen:", supabase);
  
  // Supabase initialisieren
  //const supabaseUrl = "https://hteeyyfsaotcavvtvizt.supabase.co"; // <--- DEIN URL
  //const supabaseAnonKey = "sb_publishable_pm6p0UM8_GARF3TIY51Heg_Sk3tacHJ";         // <--- DEIN ANON KEY
  //const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

  const authDiv = document.getElementById("auth");
  const userArea = document.getElementById("userArea");
  const userEmailSpan = document.getElementById("userEmail");
  const authMessage = document.getElementById("authMessage");
  
  // ---------------------------------------------------------------------
  // Login
  //----------------------------------------------------------------------
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      // Login versuchen
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      console.log("Supabase login data:", data);
      console.log("Supabase login error:", error);

      if (error) {
        authMessage.textContent = "Fehler: " + error.message;
        return;
      }

      // User korrekt aus der Session holen
      const user = data.user ?? data.session?.user;

      if (!user) {
        authMessage.textContent = "Login fehlgeschlagen: kein User gefunden.";
        return;
      }

      // User-Bereich initialisieren
      initUserArea(user);

    } catch (err) {
      console.error("Unerwarteter Fehler:", err);
      authMessage.textContent = "Unerwarteter Fehler. Siehe Konsole.";
    }
  });
  
  //-------------------------------------------------------------------------
  // Logout
  //-------------------------------------------------------------------------
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await supabase.auth.signOut();
    authDiv.style.display = "block";
    userArea.style.display = "none";
    authMessage.textContent = "";
  });

  // Benutzerbereich initialisieren
  function initUserArea(user) {
    authDiv.style.display = "none";
    userArea.style.display = "block";
    userEmailSpan.textContent = user.email;
    loadMyHours();
    loadTasks();
  }
  
  //---------------------------------------------------------------------------
  //Arbeitsdienst eintragen (Stunden speichern)
  //---------------------------------------------------------------------------
  document.getElementById("saveWorkBtn").addEventListener("click", async () => {
  const date = document.getElementById("workDate").value;
  const hours = parseFloat(document.getElementById("workHours").value);
  const desc = document.getElementById("workDesc").value;

  try {
    // Aktuellen User holen
    const { data: userData, error: userError } = await supabase.auth.getUser();

    if (userError) {
      alert("Fehler beim Abrufen des Users: " + userError.message);
      return;
    }

    if (!userData?.user) {
      alert("Kein eingeloggter User gefunden. Bitte einloggen.");
      return;
    }

    // Arbeitsstunden speichern
    const { error } = await supabase.from("work_hours").insert([{
      user_id: userData.user.id,
      date,
      hours,
      description: desc
    }]);

    if (error) {
      alert("Fehler: " + error.message);
    } else {
      loadMyHours(); // Optional: Stunden neu laden
    }

  } catch (err) {
    console.error("Unerwarteter Fehler beim Speichern:", err);
    alert("Unerwarteter Fehler. Siehe Konsole.");
  }
  });

  //----------------------------------------------------------------------------
  // Eigene Stunden laden
  //----------------------------------------------------------------------------
  async function loadMyHours() {
    const { data, error } = await supabase.from("work_hours")
      .select("*")
      .order("date", { ascending: false });
    const list = document.getElementById("hoursList");
    list.innerHTML = "";
    if(data) {
      data.forEach(h => {
        const li = document.createElement("li");
        li.textContent = `${h.date}: ${h.hours} Stunden - ${h.description}`;
        list.appendChild(li);
      });
    }
  }

  //-----------------------------------------------------------------------------------
  // Prüfen, ob User schon eingeloggt
  //-----------------------------------------------------------------------------------
  supabase.auth.onAuthStateChange((event, session) => {
    if(session && session.user) { initUserArea(session.user); }
  });

  //-----------------------------------------------------------------------------------
  // Funktion, um die verfügbaren Arbeitsdienste zu laden
  //-----------------------------------------------------------------------------------
let allTasks = [];

async function loadTasks() {
  console.log("loadTasks gestartet");

  const { data: tasks, error } = await supabase
    .from("work_tasks")
    .select(`
      id,
      title,
      start_time,
      max_helpers,
      work_task_signups ( user_id )
    `)
    .order("start_time", { ascending: true });

  if (error) {
    console.error(error);
    return;
  }

  allTasks = tasks;

  renderDayButtons(tasks);
}


//-----------------------------------------------------------------------

function renderDayButtons(tasks) {
  const dayDiv = document.getElementById("day-filter");
  dayDiv.innerHTML = "";

  const days = [
    ...new Set(
      tasks.map(t =>
        new Date(t.start_time).toISOString().split("T")[0]
      )
    )
  ];

  days.forEach(day => {
    const btn = document.createElement("button");
    btn.textContent = new Date(day).toLocaleDateString("de-DE", {
      weekday: "long",
      day: "2-digit",
      month: "2-digit"
    });

    btn.onclick = () => {
      // alle Buttons zuruecksetzen
      document
        .querySelectorAll("#day-filter button")
        .forEach(b => b.classList.remove("active"));

      // aktuellen Button aktiv setzen
      btn.classList.add("active");
      
      renderTasksForDay(day);
    };
    dayDiv.appendChild(btn);
  });
}

//-----------------------------------------------------------------------

function renderTasksForDay(day) {
  const tasksDiv = document.getElementById("tasks");
  tasksDiv.innerHTML = "";

  const tasksForDay = allTasks.filter(t =>
    t.start_time.startsWith(day)
  );

  tasksForDay.forEach(task => {
    const used = task.work_task_signups.length;
    const free = task.max_helpers - used;

    tasksDiv.innerHTML += `
      <div class="task">
        <h3>${task.title}</h3>
        <p>${new Date(task.start_time).toLocaleString("de-DE")}</p>
        <p>Helfer: ${used} / ${task.max_helpers}</p>

        ${
          free > 0
            ? `<button onclick="signup('${task.id}')">Eintragen</button>`
            : `<strong>Ausgebucht</strong>`
        }
      </div>
    `;
  });
}

  
//-----------------------------------------------------------------------
// In einem Arbeitsdienst eintragen 
//-----------------------------------------------------------------------
window.signup = async function (taskId) {
  console.log("Signup für Task:", taskId);

  const {
    data: { user },
    error: userError
  } = await supabase.auth.getUser();

  if (userError || !user) {
    alert("Bitte zuerst anmelden.");
    return;
  }

  const { error } = await supabase
    .from("work_task_signups")
    .insert({
      task_id: taskId,
      user_id: user.id
    });

  if (error) {
    alert(error.message);
    console.error(error);
    return;
  }

  // Neu laden, damit die Anmeldung sichtbar wird
  loadTasks();
};
  
  
  
</script>
</body>
</html>
